<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارزیابی چندمخاطره‌ای</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
</head>
<body>
    <div class="container">
        <h1>🌍 ارزیابی چندمخاطره‌ای</h1>

        <div class="search-section">
            <h3>🔍 جستجو</h3>
            <div class="search-row">
                <input type="text" id="searchInput" placeholder="نام مکان یا شرکت...">
                <select id="searchType">
                    <option value="place">مکان</option>
                    <option value="company">شرکت</option>
                </select>
                <button onclick="searchLocation()" class="btn-search">جستجو</button>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>

        <div class="map-section">
            <h3>🗺️ موقعیت را انتخاب کنید</h3>
            <div id="map"></div>
        </div>

        <div class="form-group">
            <label>عرض جغرافیایی:</label>
            <input type="number" id="lat" step="0.0001" value="35.6892">
        </div>

        <div class="form-group">
            <label>طول جغرافیایی:</label>
            <input type="number" id="lon" step="0.0001" value="51.3890">
        </div>

        <button id="analyzeBtn" onclick="analyzeMultiHazard()" class="btn-primary">تحلیل چندمخاطره‌ای</button>

        <div class="loading" id="loading">⏳ در حال تحلیل...</div>
        <div class="error" id="error"></div>

        <div class="result" id="result">
            <h2 id="overallRisk"></h2>
            <div id="overallScore"></div>

            <div class="hazard-cards" id="hazardCards"></div>
                        <div class="param-details" id="paramDetails"></div>

            <div class="chart-section">
                <h3>📊 نمودار راداری ریسک‌ها</h3>
                <div class="chart-container">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>

            <div class="chart-section">
                <h3>📊 مقایسه ریسک‌ها</h3>
                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>

            <div class="param-details" id="paramDetails"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
